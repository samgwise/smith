[package]
name = "smith-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Smith controller daemon: hosted sessions, approval routing and the serve API"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64.workspace = true
dunce.workspace = true
futures.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "service"] }
sha2 = "0.11"
serde.workspace = true
serde_json.workspace = true
smith-core.workspace = true
smith-egress.path = "../smith-egress"
smith-mcp.workspace = true
smith-providers.workspace = true
smith-protocol.workspace = true
smith-sandbox.workspace = true
subtle = "2"
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
futures.workspace = true
tempfile = "3"
flate2 = "1"
rcgen = "0.13"
