# CI: build, lint and test on Linux and Windows.
#
# The unix-only security tests (symlink escape S-07, 0600 permission modes
# S-15) run in the ubuntu job; the Windows job exercises the Windows-specific
# paths (drive-letter mounts, PATHEXT command resolution).
#
# The podman/nftables egress tests are `#[ignore]`-tagged: they need a real
# podman machine (and nftables inside it), which GitHub runners cannot
# provide. Run them manually on a machine with podman:
#   cargo test --workspace --ignored
name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets --verbose
      - name: Run tests
        run: cargo test --workspace --verbose
